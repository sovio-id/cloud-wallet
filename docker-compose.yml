# Minimal local stack for smoke-testing the extracted cloud-wallet service.
# For real dev/staging, point .env at the shared platform NATS + Postgres.
services:
  postgres:
    container_name: cloud-wallet-postgres
    image: postgres:16
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=credebl
    volumes:
      - cloud-wallet-pgdata:/var/lib/postgresql/data

  nats:
    container_name: cloud-wallet-nats
    image: nats
    ports:
      - '4222:4222'
      - '8222:8222'

  cloud-wallet:
    container_name: cloud-wallet-service
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_AUTH_TYPE=none
      - POOL_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/credebl?schema=public
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/credebl?schema=public
      - CRYPTO_PRIVATE_KEY=${CRYPTO_PRIVATE_KEY:-}
      - CLOUD_WALLET_NKEY_SEED=${CLOUD_WALLET_NKEY_SEED:-}
      - NATS_CREDS_FILE=${NATS_CREDS_FILE:-}

volumes:
  cloud-wallet-pgdata:
